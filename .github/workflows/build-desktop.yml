name: Build Desktop Installers

# Builds happen on GitHub's cloud runners (7GB RAM, no cost to you) —
# nothing heavy runs on your own machine. Trigger manually from the
# Actions tab, or automatically on a version tag.
#
# Outputs appear as downloadable "Artifacts" on the finished run:
#   • cycle-discovery-lite-windows   → .msi installer (~5MB)
#   • hidden-cycle-discovery-full-windows → .exe installer (~300-500MB)

on:
  workflow_dispatch:      # manual "Run workflow" button in the Actions tab
  push:
    tags:
      - "v*"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # LITE — Tauri wrapper around the standalone HTML (fast, small)
  # ─────────────────────────────────────────────────────────────────
  build-lite:
    name: Build Lite (Tauri) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Lite installer
        working-directory: desktop/tauri-lite/src-tauri
        run: cargo tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle-discovery-lite-${{ matrix.os }}
          path: |
            desktop/tauri-lite/src-tauri/target/release/bundle/msi/*.msi
            desktop/tauri-lite/src-tauri/target/release/bundle/nsis/*.exe
            desktop/tauri-lite/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/tauri-lite/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/tauri-lite/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # FULL — Electron shell + PyInstaller-frozen Python engine
  # This is the step that needs real RAM/CPU (freezing scipy/torch) —
  # it runs entirely on GitHub's servers, never on your PC.
  # ─────────────────────────────────────────────────────────────────
  build-full:
    name: Build Full (Electron + Engine) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]   # add macos-latest / ubuntu-latest if you want those too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Freeze the Python engine with PyInstaller
        working-directory: backend
        run: pyinstaller --clean hcd-engine.spec

      - name: Copy engine into desktop resources
        run: node desktop/electron/scripts/copy-engine.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static frontend export
        working-directory: frontend
        run: npm run build

      - name: Copy UI into desktop resources
        run: node desktop/electron/scripts/copy-ui.js

      - name: Install Electron dependencies
        working-directory: desktop/electron
        run: npm install

      - name: Build installer
        working-directory: desktop/electron
        run: npx electron-builder --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidden-cycle-discovery-full-${{ matrix.os }}
          path: |
            desktop/electron/dist/*.exe
            desktop/electron/dist/*.dmg
            desktop/electron/dist/*.AppImage
            desktop/electron/dist/*.deb
          if-no-files-found: warn
